<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Bookmarks Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1d1d1f;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #6e6e73;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .upload-section {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .clear-btn {
            padding: 12px 24px;
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 2px solid #ff3b30;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: #ff3b30;
            color: white;
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 120px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6e6e73;
            margin-top: 5px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: rgba(52, 199, 89, 0.1);
            color: #34c759;
            border: 1px solid rgba(52, 199, 89, 0.3);
        }

        .message.error {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }

        .bookmarks-container {
            margin-top: 30px;
        }

        .accordion-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .accordion-item:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .accordion-header {
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            transition: all 0.3s ease;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .accordion-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .folder-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .accordion-count {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .accordion-arrow {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #667eea;
        }

        .accordion-item.active .accordion-arrow {
            transform: rotate(180deg);
            background: #667eea;
            color: white;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-item.active .accordion-content {
            max-height: 2000px;
        }

        .accordion-body {
            padding: 0 25px 25px 25px;
        }

        .bookmark-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(248, 249, 250, 0.8);
            border-radius: 12px;
            text-decoration: none;
            color: #1d1d1f;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .bookmark-link:hover {
            background: rgba(102, 126, 234, 0.05);
            transform: translateX(5px);
            border-color: rgba(102, 126, 234, 0.2);
        }

        .bookmark-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
            background: #f0f0f0;
        }

        .bookmark-text {
            flex: 1;
            font-weight: 500;
            line-height: 1.4;
        }

        .bookmark-url {
            font-size: 0.85rem;
            color: #6e6e73;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6e6e73;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #1d1d1f;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #6e6e73;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .upload-section {
                flex-direction: column;
                align-items: stretch;
            }
            
            .stats {
                justify-content: center;
            }
            
            .accordion-title {
                font-size: 1.1rem;
            }
            
            .bookmark-link {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Chrome Bookmarks Manager</h1>
            <p>Upload and organize your Chrome bookmarks with persistent storage and beautiful accordion folders.</p>
            
            <div class="upload-section">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".xml,.html" multiple />
                    <label for="fileInput" class="file-input-label">
                        <span>📁</span>
                        <span>Upload Bookmarks</span>
                    </label>
                </div>
                
                <button class="clear-btn" onclick="clearAllData()">
                    🗑️ Clear All Data
                </button>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="filesCount">0</div>
                    <div class="stat-label">Files Uploaded</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="foldersCount">0</div>
                    <div class="stat-label">Folders</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="bookmarksCount">0</div>
                    <div class="stat-label">Bookmarks</div>
                </div>
            </div>
            
            <div id="message" class="message"></div>
        </div>
        
        <div id="bookmarks-container" class="bookmarks-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>Loading your bookmarks...</span>
            </div>
        </div>
    </div>

    <script>
        class BookmarksManager {
            constructor() {
                this.storageKey = 'chrome-bookmarks-data';
                this.data = this.loadData();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.displayBookmarks();
                this.updateStats();
                
                // Hide loading after a short delay
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }

            setupEventListeners() {
                document.getElementById('fileInput').addEventListener('change', (e) => {
                    this.handleFileUpload(e);
                });
            }

            loadData() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    return stored ? JSON.parse(stored) : { files: {}, folders: {} };
                } catch (error) {
                    console.error('Error loading data:', error);
                    return { files: {}, folders: {} };
                }
            }

            saveData() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                } catch (error) {
                    console.error('Error saving data:', error);
                    this.showMessage('Error saving data. Storage might be full.', 'error');
                }
            }

            async handleFileUpload(event) {
                const files = Array.from(event.target.files);
                if (files.length === 0) return;

                this.showMessage('Processing files...', 'success');

                for (const file of files) {
                    try {
                        const content = await this.readFile(file);
                        const fileId = this.generateFileId(file.name);
                        
                        // Store file metadata
                        this.data.files[fileId] = {
                            name: file.name,
                            uploadDate: new Date().toISOString(),
                            size: file.size
                        };

                        // Process bookmarks
                        const bookmarks = this.parseBookmarks(content);
                        this.processBookmarks(bookmarks, fileId);
                        
                    } catch (error) {
                        console.error('Error processing file:', file.name, error);
                        this.showMessage(`Error processing ${file.name}: ${error.message}`, 'error');
                    }
                }

                this.saveData();
                this.displayBookmarks();
                this.updateStats();
                
                // Clear file input
                event.target.value = '';
                
                this.showMessage(`Successfully processed ${files.length} file(s)!`, 'success');
            }

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsText(file);
                });
            }

            generateFileId(filename) {
                return btoa(filename + Date.now()).replace(/[^a-zA-Z0-9]/g, '').substring(0, 16);
            }

            parseBookmarks(xmlContent) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlContent, 'text/html');
                
                const folders = {};
                const allDLs = doc.querySelectorAll('DL');
                
                if (allDLs.length > 0) {
                    const mainDL = allDLs[0];
                    const directChildren = Array.from(mainDL.children);
                    
                    directChildren.forEach(child => {
                        if (child.tagName === 'DT') {
                            const h3 = child.querySelector('H3');
                            if (h3) {
                                const folderName = h3.textContent.trim();
                                const folderDL = child.querySelector('DL');
                                if (folderDL) {
                                    folders[folderName] = this.extractLinks(folderDL);
                                }
                            }
                        }
                    });
                }
                
                return folders;
            }

            extractLinks(element) {
                const links = [];
                const anchors = element.querySelectorAll('A');
                
                anchors.forEach(anchor => {
                    const href = anchor.getAttribute('HREF') || anchor.getAttribute('href');
                    const icon = anchor.getAttribute('ICON') || anchor.getAttribute('icon');
                    const text = anchor.textContent.trim();
                    
                    if (href) {
                        links.push({
                            url: href,
                            icon: icon,
                            text: text,
                            domain: this.extractDomain(href)
                        });
                    }
                });
                
                return links;
            }

            extractDomain(url) {
                try {
                    const urlObj = new URL(url);
                    return urlObj.protocol + '//' + urlObj.hostname;
                } catch (e) {
                    return url;
                }
            }

            processBookmarks(bookmarks, fileId) {
                Object.keys(bookmarks).forEach(folderName => {
                    if (!this.data.folders[folderName]) {
                        this.data.folders[folderName] = {};
                    }
                    
                    const links = bookmarks[folderName];
                    const processedLinks = this.deduplicateLinks(links);
                    
                    // Merge with existing folder data
                    processedLinks.forEach(link => {
                        const domain = link.domain;
                        if (!this.data.folders[folderName][domain] || 
                            link.url.length < this.data.folders[folderName][domain].url.length) {
                            this.data.folders[folderName][domain] = {
                                ...link,
                                sourceFile: fileId
                            };
                        }
                    });
                });
            }

            deduplicateLinks(links) {
                const domainMap = new Map();
                
                links.forEach(link => {
                    const domain = link.domain;
                    
                    if (!domainMap.has(domain) || link.url.length < domainMap.get(domain).url.length) {
                        try {
                            const url = new URL(link.url);
                            // Prefer root domain links
                            if (url.pathname === '/' || url.pathname === '') {
                                domainMap.set(domain, link);
                            } else if (!domainMap.has(domain)) {
                                domainMap.set(domain, link);
                            }
                        } catch (e) {
                            if (!domainMap.has(domain)) {
                                domainMap.set(domain, link);
                            }
                        }
                    }
                });
                
                return Array.from(domainMap.values());
            }

            displayBookmarks() {
                const container = document.getElementById('bookmarks-container');
                
                if (Object.keys(this.data.folders).length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📁</div>
                            <h3>No bookmarks yet</h3>
                            <p>Upload your Chrome bookmarks XML files to get started!</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                
                Object.keys(this.data.folders).forEach(folderName => {
                    const links = Object.values(this.data.folders[folderName]);
                    if (links.length === 0) return;
                    
                    const folderId = this.sanitizeId(folderName);
                    
                    html += `
                        <div class="accordion-item" id="folder-${folderId}">
                            <div class="accordion-header" onclick="bookmarksManager.toggleAccordion('${folderId}')">
                                <div class="accordion-title">
                                    <div class="folder-icon">📁</div>
                                    <span>${this.escapeHtml(folderName)}</span>
                                    <div class="accordion-count">${links.length}</div>
                                </div>
                                <div class="accordion-arrow">▼</div>
                            </div>
                            <div class="accordion-content">
                                <div class="accordion-body">
                                    ${this.renderLinks(links)}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                
                // Apply icons after rendering
                setTimeout(() => this.applyIcons(), 100);
            }

            renderLinks(links) {
                return links.map(link => `
                    <a href="${this.escapeHtml(link.url)}" 
                       class="bookmark-link" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       ${link.icon ? `data-icon="${this.escapeHtml(link.icon)}"` : ''}>
                        <div class="bookmark-icon"></div>
                        <div class="bookmark-content">
                            <div class="bookmark-text">${this.escapeHtml(link.text || link.url)}</div>
                            <div class="bookmark-url">${this.escapeHtml(link.domain)}</div>
                        </div>
                    </a>
                `).join('');
            }

            toggleAccordion(folderId) {
                const item = document.getElementById(`folder-${folderId}`);
                if (item) {
                    item.classList.toggle('active');
                }
            }

            applyIcons() {
                const links = document.querySelectorAll('.bookmark-link[data-icon]');
                
                links.forEach(link => {
                    const icon = link.getAttribute('data-icon');
                    const iconContainer = link.querySelector('.bookmark-icon');
                    
                    if (icon && iconContainer) {
                        const img = document.createElement('img');
                        img.src = icon;
                        img.width = 20;
                        img.height = 20;
                        img.style.borderRadius = '4px';
                        img.onerror = () => {
                            // Fallback to default icon if image fails to load
                            iconContainer.innerHTML = '🔗';
                            iconContainer.style.display = 'flex';
                            iconContainer.style.alignItems = 'center';
                            iconContainer.style.justifyContent = 'center';
                            iconContainer.style.fontSize = '14px';
                        };
                        
                        iconContainer.innerHTML = '';
                        iconContainer.appendChild(img);
                    }
                });
            }

            updateStats() {
                const filesCount = Object.keys(this.data.files).length;
                const foldersCount = Object.keys(this.data.folders).length;
                const bookmarksCount = Object.values(this.data.folders)
                    .reduce((total, folder) => total + Object.keys(folder).length, 0);
                
                document.getElementById('filesCount').textContent = filesCount;
                document.getElementById('foldersCount').textContent = foldersCount;
                document.getElementById('bookmarksCount').textContent = bookmarksCount;
            }

            showMessage(text, type = 'success') {
                const messageEl = document.getElementById('message');
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
                messageEl.style.display = 'block';
                
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 5000);
            }

            sanitizeId(str) {
                return str.replace(/[^a-zA-Z0-9]/g, '_');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            clearAll() {
                if (confirm('Are you sure you want to clear all bookmarks data? This cannot be undone.')) {
                    this.data = { files: {}, folders: {} };
                    this.saveData();
                    this.displayBookmarks();
                    this.updateStats();
                    this.showMessage('All data cleared successfully!', 'success');
                }
            }
        }

        // Global functions
        function clearAllData() {
            bookmarksManager.clearAll();
        }

        // Initialize the app
        const bookmarksManager = new BookmarksManager();
    </script>
</body>
</html>
