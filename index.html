<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWS Bookmark Manager | Premium Link Curator</title>
    <meta name="description"
        content="A high-end, offline-capable bookmarks manager with intelligent normalization and a premium grid layout.">

    <!-- Design tokens and base styles -->
    <link rel="stylesheet" href="assets/css/main.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">

    <!-- GSAP for core animations (Local) -->
    <script src="assets/js/vendor/gsap.min.js"></script>
    <script src="assets/js/vendor/ScrollTrigger.min.js"></script>
</head>

<body class="loading">

    <!-- Premium Preloader -->
    <div id="preloader" class="preloader">
        <div class="preloader-panel top"></div>
        <div class="preloader-panel bottom"></div>

        <div class="preloader-content">
            <div class="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div class="percentage-counter" id="percent-counter">000%</div>
    </div>

    <!-- Processing Overlay (For Imports) -->
    <div id="processing-overlay" class="processing-overlay">
        <div class="processing-panel top"></div>
        <div class="processing-panel bottom"></div>

        <div class="processing-content">
            <h3 id="processing-status">Curating Library</h3>
            <div class="processing-progress-wrapper">
                <div id="processing-bar" class="processing-bar"></div>
            </div>
            <p id="processing-detail">Organizing your digital resources...</p>
        </div>
    </div>

    <!-- Main Content -->
    <main id="app" class="main-content">
        <header class="site-header">
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-dot"></span>
                    <h1>Bookmarks</h1>
                </div>

                <div class="search-box" id="search-container">
                    <input type="text" id="search-input" placeholder="Search curated library..." autocomplete="off">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <button id="search-clear" class="search-clear-btn" title="Clear Search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="header-actions">
                    <div class="stats" id="link-count">0 Links</div>
                    <button id="theme-toggle" class="theme-btn" title="Toggle Theme">
                        <span id="theme-icon">🌙</span>
                    </button>
                    <button id="toc-toggle" class="secondary-btn">Index</button>
                    <!-- To enable the Mapping feature, uncomment the button below -->
                    <!-- <button id="mapping-data" class="secondary-btn">Mapping</button> -->
                    <button id="export-data" class="secondary-btn">Export</button>
                    <button id="clear-data" class="secondary-btn">Clear All</button>
                    <div id="upload-trigger" class="upload-btn">
                        <span>Import</span>
                    </div>
                    <input type="file" id="file-upload" multiple accept=".html,.xml,.json" hidden>
                </div>
            </div>
        </header>

        <section id="content-area" class="section-container">
            <!-- Categories and Grids will be injected here -->
            <div class="empty-state" id="empty-state">
                <div class="empty-text">
                    <h2>Drop your files or click upload to begin.</h2>
                    <p>No database. No tracking. Purely in-memory parsing.</p>
                </div>
            </div>
        </section>

        <!-- Floating Side Panel (TOC) -->
        <div id="side-panel-overlay" class="side-panel-overlay"></div>
        <aside id="side-panel" class="side-panel">
            <div class="side-panel-header">
                <h3 class="side-panel-title">Navigate</h3>
                <button id="toc-close" class="close-btn">&times;</button>
            </div>
            <ul id="toc-list" class="toc-list">
                <!-- Links injected here -->
            </ul>
        </aside>

        <!-- Back to Top -->
        <button id="scroll-top" class="scroll-top-btn" title="Back to Top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
        </button>

        <!-- Custom Modal -->
        <div id="custom-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-content">
                    <h3 id="modal-title">Are you sure?</h3>
                    <p id="modal-message">This action cannot be undone.</p>
                    <div class="modal-actions">
                        <button id="modal-cancel" class="modal-btn secondary">Cancel</button>
                        <button id="modal-confirm" class="modal-btn primary">Confirm</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div class="footer-inner">
                <p>&copy; 2026 MWS Bookmark Manager. All rights reserved.</p>
            </div>
        </footer>
    </main>

    <!-- Logic -->
    <script src="assets/js/parser.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
